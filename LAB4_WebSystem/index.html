<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card p-4 shadow-sm" style="width: 360px;">
        <div class="text-center mb-3">
            <img src="assets/logo.png" alt="Logo" class="img-fluid mb-2" style="max-height: 50px;" onerror="this.style.display='none'">
            <h4 class="fw-bold">Sign In</h4>
        </div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="usernameInput" class="form-label">Username</label>
                <input type="text" id="usernameInput" class="form-control" required placeholder="Enter username">
            </div>
            <div class="mb-3">
                <label for="passwordInput" class="form-label">Password</label>
                <input type="password" id="passwordInput" class="form-control" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
