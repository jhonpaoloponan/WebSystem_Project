<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-box-seam me-2"></i>Inventory System</a>
      <div class="d-flex align-items-center text-white">
        <div class="form-check form-switch me-3">
          <input class="form-check-input" type="checkbox" id="autoRefreshToggle" checked>
          <label class="form-check-label text-light" for="autoRefreshToggle">
            <i class="bi bi-arrow-repeat"></i> Auto Live Updates
          </label>
        </div>
        <button id="exportCsvBtn" class="btn btn-outline-light btn-sm me-2">
          <i class="bi bi-download"></i> Export CSV
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4">
    <div id="alertContainer" class="mb-3"></div>

    <div class="row mb-4">
      <div class="col-lg-6 mb-3 mb-lg-0">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-white font-weight-bold fw-bold">
            <i class="bi bi-bar-chart-line text-primary me-2"></i>Inventory Value by Category
          </div>
          <div class="card-body">
            <div style="position: relative; height: 300px; width: 100%;">
              <canvas id="categoryChartCanvas"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-white font-weight-bold fw-bold">
            <i class="bi bi-pie-chart text-info me-2"></i>Stock Status Distribution
          </div>
          <div class="card-body">
            <div style="position: relative; height: 300px; width: 100%;">
              <canvas id="statusChartCanvas"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-list-task me-2"></i>Inventory Stock Items</h5>
        <div class="d-flex gap-2">
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search product or SKU...">
          <select id="categoryFilter" class="form-select form-select-sm">
            <option value="all">All Categories</option>
            <option value="Peripherals">Peripherals</option>
            <option value="Displays">Displays</option>
            <option value="Accessories">Accessories</option>
            <option value="Audio">Audio</option>
            <option value="Storage">Storage</option>
          </select>
          <select id="statusFilter" class="form-select form-select-sm">
            <option value="all">All Statuses</option>
            <option value="In Stock">In Stock</option>
            <option value="Low Stock">Low Stock</option>
            <option value="Out of Stock">Out of Stock</option>
          </select>
        </div>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>SKU ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price (₱)</th>
                <th>Quantity</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/DataManager.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
